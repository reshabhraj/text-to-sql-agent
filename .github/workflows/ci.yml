name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m db.seed
      - run: python -m pytest
      - run: python -m eval.run_eval --provider mock --fail-under 100 --out "$RUNNER_TEMP/results.md"
